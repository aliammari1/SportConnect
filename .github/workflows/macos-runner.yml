name: macOS Runner Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-26
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Upterm SSH session
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
